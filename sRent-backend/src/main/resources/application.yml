server:
  port: ${SERVER_PORT:3001}
  forward-headers-strategy: framework
spring:
  application.name: srent-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/srent}
    username: ${POSTGRES_USER:srent}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate:
      jdbc.time_zone: UTC
      default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet.multipart:
    max-file-size: ${MAX_UPLOAD_SIZE:100MB}
    max-request-size: ${MAX_UPLOAD_SIZE:100MB}
  jackson.default-property-inclusion: non_null
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
springdoc.swagger-ui:
  path: /swagger-ui/index.html
  operations-sorter: method
app:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT8H}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER}
    secret-key: ${MINIO_ROOT_PASSWORD}
    public-bucket: ${MINIO_PUBLIC_BUCKET:srent-public}
    private-bucket: ${MINIO_PRIVATE_BUCKET:srent-private}
    presign-expiry: ${PRESIGN_EXPIRY:PT15M}
  media:
    gps-radius-meters: ${GPS_RADIUS_METERS:50}
    max-gps-accuracy-meters: ${MAX_GPS_ACCURACY_METERS:30}
    max-location-age: ${MAX_LOCATION_AGE:PT5M}
    max-video-size-bytes: ${MAX_VIDEO_SIZE_BYTES:104857600}
  providers:
    ekyc-mode: ${EKYC_PROVIDER:mock}
    contract-mode: ${CONTRACT_ANALYSIS_PROVIDER:mock}
    ekyc-endpoint: ${EKYC_ENDPOINT:}
    ekyc-api-key: ${EKYC_API_KEY:}
    contract-endpoint: ${CONTRACT_ANALYSIS_ENDPOINT:}
    contract-api-key: ${CONTRACT_ANALYSIS_API_KEY:}
  ct01-font-path: ${CT01_FONT_PATH:/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf}
---
spring.config.activate.on-profile: dev
app.seed-enabled: true
---
spring.config.activate.on-profile: prod
app.seed-enabled: false
